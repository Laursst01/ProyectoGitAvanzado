name: Prueba Self-Hosted Runner
on:
  push:
jobs:
  comprobar-tokens:
    runs-on: self-hosted
    steps:
      - name: Comprobar DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "DEV_TOKEN coincide correctamente."
          }
          else {
            throw "DEV_TOKEN NO coincide con LOCAL_DEV_TOKEN."
          }
      - name: Comprobar PROD_TOKEN
        shell: powershell
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ($env:PROD_TOKEN -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "PROD_TOKEN coincide correctamente."
          }
          else {
            throw "PROD_TOKEN NO coincide con LOCAL_PROD_TOKEN."
          }